version: '3.8'

services:
  db-devforge:
    image: postgres:16-alpine
    container_name: postgres-devforge
    env_file:
      - .env # Inyecta las variables exclusivas del contenedor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: